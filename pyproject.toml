[project]
name = "build-context-audit-skill-dev"
version = "0.1.0"
description = "Development environment (tests) for the build-context-audit agent skill. The skill itself needs only Python 3.10+."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0", "pytest-cov>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/build-context-audit/scripts"]
